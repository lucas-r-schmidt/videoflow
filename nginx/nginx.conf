worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;  # conservador para 2 vCPU
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ──────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time "$request" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;

    # ── Rate limit: 10 req/s por IP (proteção básica) ─────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ── Tamanho máximo do body (para uploads futuros) ─────────
    client_max_body_size 500M;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Certbot: responde ao desafio ACME
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS principal ───────────────────────────────────────
    server {
        listen 443 ssl;
        server_name seudominio.com;   # trocar pelo domínio real

        # Certificados gerados pelo Certbot
        ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # ── Headers de segurança ──────────────────────────────
        add_header X-Frame-Options       DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy       strict-origin;

        # ── Proxy para FastAPI ────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout maior para jobs longos
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
        }

        location /health {
            proxy_pass http://api:8000/health;
        }

        location /auth/ {
            proxy_pass         http://api:8000/auth/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
